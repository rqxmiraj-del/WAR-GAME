<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>WAR — 10 Challenges</title>
<style>
:root{--bg:#07080d;--panel:#11131d;--line:#292d3d;--text:#f7f8ff;--muted:#9ca3b8;--accent:#ff3158;--accent2:#7c5cff;--good:#32e875;--gold:#ffd35a}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% 0,#191526 0,#07080d 48%);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}body{overflow-x:hidden}.app{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px}.screen{width:min(760px,100%);min-height:calc(100vh - 36px);display:flex;flex-direction:column}.hidden{display:none!important}.glass{background:linear-gradient(180deg,rgba(22,24,36,.95),rgba(11,13,21,.95));border:1px solid var(--line);box-shadow:0 25px 70px rgba(0,0,0,.45);border-radius:28px}.start{margin:auto;padding:38px 24px;text-align:center;position:relative;overflow:hidden}.start:before{content:"";position:absolute;inset:-40%;background:conic-gradient(from 180deg,transparent,#ff315833,transparent,#7c5cff33,transparent);animation:spin 8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.start>*{position:relative}.eyebrow{font-size:12px;letter-spacing:4px;color:var(--muted);font-weight:800}.logo{font-size:clamp(62px,18vw,130px);line-height:.85;margin:22px 0 16px;font-weight:1000;letter-spacing:12px;background:linear-gradient(110deg,#fff,#ff3158 45%,#7c5cff);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 45px #ff315833}.tag{color:#cbd0df;font-size:14px}.credit{margin:34px 0;color:#fff;font-weight:800}.credit span{color:var(--accent)}button{border:0;font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}.primary{width:100%;padding:17px 22px;border-radius:16px;background:linear-gradient(100deg,#ff3158,#7c5cff);font-weight:1000;letter-spacing:1px;box-shadow:0 12px 35px #7c5cff35}.primary:active,.choice:active,.key:active{transform:scale(.98)}.small{font-size:12px;color:var(--muted);margin-top:18px}.top{padding:16px 4px;display:flex;align-items:center;justify-content:space-between;gap:12px}.level-label{font-weight:900}.stats{display:flex;gap:8px}.pill{border:1px solid var(--line);background:#0e1018;padding:7px 10px;border-radius:12px;font-size:12px;color:#dce0ed}.game{flex:1;padding:20px;display:flex;flex-direction:column}.game h1{text-align:center;margin:5px 0 8px;font-size:26px}.desc{text-align:center;color:var(--muted);font-size:13px;margin:0 auto 20px;max-width:560px}.area{flex:1;min-height:390px;display:flex;align-items:center;justify-content:center;position:relative}.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;width:min(560px,100%)}.choice{padding:20px;border:1px solid var(--line);background:#161925;border-radius:16px;font-weight:800}.choice:hover{border-color:#535a77}.feedback{text-align:center;min-height:28px;font-weight:900;margin:12px}.good{color:var(--good)}.bad{color:#ff5d78}.next{margin-top:auto}.progress{height:5px;background:#202331;border-radius:9px;overflow:hidden}.progress>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));width:0}.sudoku{display:grid;grid-template-columns:repeat(9,1fr);width:min(390px,100%);aspect-ratio:1;border:2px solid #777;box-shadow:0 0 0 1px #222}.sudoku button{background:#11131b;border:1px solid #292c3a;font-size:clamp(14px,4vw,22px);font-weight:800}.sudoku button:nth-child(3n){border-right:2px solid #777}.sudoku button:nth-child(n+19):nth-child(-n+27),.sudoku button:nth-child(n+46):nth-child(-n+54){border-bottom:2px solid #777}.sudoku .fixed{color:#fff}.sudoku .input{color:#7c9cff}.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:min(330px,100%)}.key{padding:16px;background:#171a25;border:1px solid var(--line);border-radius:12px;font-weight:900}.code{font-size:42px;letter-spacing:10px;text-align:center;margin:20px}.maze{display:grid;grid-template-columns:repeat(10,1fr);width:min(400px,100%);aspect-ratio:1}.cell{border:1px solid #191c27;background:#0c0e15}.wall{background:#596074}.player{background:var(--accent);box-shadow:0 0 15px #ff3158}.exit{background:var(--good)}.reaction{width:min(360px,90%);aspect-ratio:1;border-radius:50%;background:#1a1d28;display:grid;place-items:center;font-weight:1000;font-size:28px;border:2px solid #333}.memory-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;width:min(390px,100%)}.mem{aspect-ratio:1;border-radius:14px;background:#171a25;border:1px solid var(--line)}.mem.on{background:#fff}.target-area{width:min(600px,100%);height:360px;border:1px solid var(--line);border-radius:20px;background:#0b0d14;position:relative;overflow:hidden}.target{position:absolute;width:58px;height:58px;border-radius:50%;background:var(--accent);box-shadow:0 0 30px #ff315866}.riddle{width:min(560px,100%);text-align:center}.riddle .question{font-size:22px;font-weight:900;line-height:1.35;margin-bottom:20px}.input{width:100%;padding:15px;border-radius:13px;border:1px solid var(--line);background:#0d0f17;color:#fff;outline:none}.input:focus{border-color:var(--accent2)}.toast{position:fixed;left:50%;bottom:25px;transform:translateX(-50%);background:#161925;border:1px solid var(--line);padding:12px 18px;border-radius:14px;opacity:0;pointer-events:none;transition:.25s}.toast.show{opacity:1}.final{text-align:center;padding:35px}.trophy{font-size:70px}.score-big{font-size:55px;font-weight:1000;color:var(--gold)}@media(max-width:520px){.app{padding:8px}.screen{min-height:calc(100vh - 16px)}.game{padding:15px}.area{min-height:350px}.top{padding:12px 2px}.stats{gap:5px}.pill{padding:6px 8px}}
</style>
</head>
<body><div class="app"><main class="screen">
<section id="start" class="start glass"><div class="eyebrow">THE ULTIMATE CHALLENGE</div><div class="logo">WAR</div><div class="tag">10 LEVELS • 10 DIFFERENT BATTLES</div><div class="credit">Developed by <span>Miraj</span></div><button class="primary" id="startBtn">START WAR</button><div class="small">Think fast. Stay sharp. Finish all 10.</div></section>
<section id="game" class="hidden"><div class="top"><div class="level-label" id="levelLabel">LEVEL 01</div><div class="stats"><div class="pill">❤️ <b id="lives">3</b></div><div class="pill">🏆 <b id="score">0</b></div><div class="pill">⏱️ <b id="timer">—</b></div></div></div><div class="progress"><i id="progress"></i></div><div class="game glass"><h1 id="title"></h1><p class="desc" id="desc"></p><div class="area" id="area"></div><div class="feedback" id="feedback"></div><button id="nextBtn" class="primary next hidden">NEXT LEVEL →</button></div></section>
<section id="final" class="final glass hidden"><div class="trophy">🏆</div><div class="eyebrow">WAR COMPLETE</div><h1>YOU SURVIVED ALL 10</h1><div class="score-big" id="finalScore">0</div><p>Final Score</p><p class="credit">Developed by <span>Miraj</span></p><button class="primary" id="againBtn">PLAY AGAIN</button></section>
</main></div><div id="toast" class="toast"></div>
<script>
const $=s=>document.querySelector(s);let level=0,lives=3,score=0,time=0,timerId=null,cleanup=()=>{};
const levels=[
['Logic Trap','Find the only option that must be true.'],['Snake Rush','Collect 8 targets before time runs out.'],['Sudoku','Complete the missing cells.'],['Code Breaker','Crack the 4-digit code using the clues.'],['Maze Escape','Reach the green exit using the arrow controls.'],['Reaction War','Wait for the signal, then tap as fast as you can.'],['Memory Attack','Memorize the highlighted pattern and repeat it.'],['Precision Target','Hit 5 moving targets before time runs out.'],['Mystery Riddle','Solve the riddle. Think beyond the obvious.'],['FINAL WAR','Complete three rapid challenges.']];
function toast(t){let x=$('#toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1500)}
function startTimer(sec,onEnd){clearInterval(timerId);time=sec;$('#timer').textContent=time;timerId=setInterval(()=>{time--;$('#timer').textContent=time;if(time<=0){clearInterval(timerId);onEnd()}},1000)}
function stopTimer(){clearInterval(timerId);$('#timer').textContent='—'}
function fail(msg='TIME OVER'){lives--;$('#lives').textContent=lives;$('#feedback').innerHTML='<span class="bad">'+msg+'</span>';if(lives<=0){setTimeout(()=>endGame(false),700)}else{setTimeout(()=>loadLevel(level),700)}}
function win(points=100){score+=points;$('#score').textContent=score;stopTimer();$('#feedback').innerHTML='<span class="good">LEVEL COMPLETE! +' + points+'</span>';$('#nextBtn').classList.remove('hidden')}
function loadLevel(i){cleanup();cleanup=()=>{};stopTimer();level=i;$('#levelLabel').textContent='LEVEL '+String(i+1).padStart(2,'0');$('#progress').style.width=((i)/10*100)+'%';$('#title').textContent=levels[i][0];$('#desc').textContent=levels[i][1];$('#feedback').textContent='';$('#nextBtn').classList.add('hidden');const area=$('#area');area.innerHTML='';window.scrollTo(0,0);[logic,snake,sudoku,codebreaker,maze,reaction,memory,target,riddle,finalWar][i](area)}
function logic(a){const qs=[['2, 4, 8, 16, ?','20','24','32','34','32'],['Which weighs more?','1kg iron','1kg cotton','Iron','Cannot tell','Cannot tell'],['A clock shows 3:15. Angle between hands?','0°','7.5°','30°','45°','7.5°']];let q=qs[Math.floor(Math.random()*qs.length)];a.innerHTML='<div class="choices">'+q.slice(1,5).map((x,i)=>`<button class="choice" data-v="${x}">${x}</button>`).join('')+'</div>';a.previousElementSibling;document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{if(b.dataset.v===q[5])win(100);else fail('WRONG ANSWER')});startTimer(25,()=>fail())}
function snake(a){a.innerHTML='<canvas id="snakeCanvas" style="width:min(420px,100%);aspect-ratio:1;background:#0b0d14;border:1px solid #292d3d;border-radius:18px"></canvas>';let c=$('#snakeCanvas'),ctx=c.getContext('2d'),n=16,s=[{x:8,y:8}],d={x:1,y:0},next=d,food={x:4,y:4},got=0;function resize(){c.width=c.clientWidth*devicePixelRatio;c.height=c.clientWidth*devicePixelRatio;ctx.scale(devicePixelRatio,devicePixelRatio)}resize();window.addEventListener('resize',resize);function spawn(){do{food={x:Math.floor(Math.random()*n),y:Math.floor(Math.random()*n)}}while(s.some(p=>p.x===food.x&&p.y===food.y))}function draw(){let z=c.clientWidth/n;ctx.clearRect(0,0,c.clientWidth,c.clientWidth);ctx.fillStyle='#ff3158';ctx.fillRect(food.x*z+z*.18,food.y*z+z*.18,z*.64,z*.64);s.forEach((p,i)=>{ctx.fillStyle=i?'#7c5cff':'#fff';ctx.fillRect(p.x*z+2,p.y*z+2,z-4,z-4)})}let iv=setInterval(()=>{d=next;let h={x:s[0].x+d.x,y:s[0].y+d.y};if(h.x<0||h.y<0||h.x>=n||h.y>=n||s.some(p=>p.x===h.x&&p.y===h.y)){clearInterval(iv);fail('SNAKE CRASH');return}s.unshift(h);if(h.x===food.x&&h.y===food.y){got++;if(got>=8){clearInterval(iv);win(130)}else spawn()}else s.pop();draw()},130);function key(e){if(e.key==='ArrowUp'&&d.y!==1)next={x:0,y:-1};if(e.key==='ArrowDown'&&d.y!==-1)next={x:0,y:1};if(e.key==='ArrowLeft'&&d.x!==1)next={x:-1,y:0};if(e.key==='ArrowRight'&&d.x!==-1)next={x:1,y:0}}window.addEventListener('keydown',key);let sy,sx; c.ontouchstart=e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY};c.ontouchend=e=>{let dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>Math.abs(dy)){if(dx>0&&d.x!==-1)next={x:1,y:0};else if(d.x!==1)next={x:-1,y:0}}else{if(dy>0&&d.y!==-1)next={x:0,y:1};else if(d.y!==1)next={x:0,y:-1}}};spawn();draw();startTimer(35,()=>{clearInterval(iv);fail()});cleanup=()=>{clearInterval(iv);window.removeEventListener('keydown',key);window.removeEventListener('resize',resize)}}
function sudoku(a){const puzzle=[5,3,0,0,7,0,0,0,0,6,0,0,1,9,5,0,0,0,0,9,8,0,0,0,0,6,0,8,0,0,0,6,0,0,0,3,4,0,0,8,0,3,0,0,1,7,0,0,0,2,0,0,0,6,0,6,0,0,0,0,2,8,0,0,0,4,1,9,0,0,5,0,0,0,0,8,0,0,7,9];const solution=[5,3,4,6,7,8,9,1,2,6,7,2,1,9,5,3,4,8,1,9,8,3,4,2,5,6,7,8,5,9,7,6,1,4,2,3,4,2,6,8,5,3,7,9,1,7,1,3,9,2,4,8,5,6,9,6,1,5,3,7,2,8,4,2,8,7,4,1,9,6,3,5,3,4,5,2,8,6,1,7,9];a.innerHTML='<div class="sudoku">'+puzzle.map((v,i)=>`<button ${v?'class="fixed"':''} data-i="${i}">${v||''}</button>`).join('')+'</div>';document.querySelectorAll('.sudoku button').forEach(b=>{if(!b.classList.contains('fixed'))b.onclick=()=>{let i=+b.dataset.i;let v=prompt('Enter 1-9');if(!/^[1-9]$/.test(v))return;b.textContent=v;if(+v!==solution[i]){b.textContent='';fail('WRONG CELL')}else if([...document.querySelectorAll('.sudoku button')].every((x,j)=>x.textContent==solution[j]))win(180)}});startTimer(75,()=>fail())}
function codebreaker(a){let code=String(1374+Math.floor(Math.random()*7000)).slice(0,4);a.innerHTML='<div style="width:min(360px,100%);text-align:center"><div class="code">____</div><div class="keypad">'+[1,2,3,4,5,6,7,8,9,0].map(x=>`<button class="key">${x}</button>`).join('')+'</div><button class="primary" id="submitCode" style="margin-top:12px">SUBMIT</button></div>';let val='';const display=$('.code');document.querySelectorAll('.key').forEach(k=>k.onclick=()=>{if(val.length<4){val+=k.textContent;display.textContent=val.padEnd(4,'_')}});$('#submitCode').onclick=()=>{if(val===code)win(140);else{val='';display.textContent='____';fail('CODE REJECTED')}};startTimer(40,()=>fail())}
function maze(a){const map=['1111111111','1000000001','1011111101','1010000101','1010110101','1010000101','1011110101','1000010001','1111011101','1111111111'];let p={x:1,y:1},exit={x:8,y:8};a.innerHTML='<div style="display:flex;flex-direction:column;align-items:center;gap:12px"><div class="maze"></div><div class="keypad" style="width:180px;grid-template-columns:repeat(3,1fr)"><button class="key" data-d="up">↑</button><button class="key" data-d="left">←</button><button class="key" data-d="down">↓</button><button class="key" data-d="right">→</button></div></div>';let m=$('.maze');function draw(){m.innerHTML='';map.forEach((row,y)=>[...row].forEach((v,x)=>{let d=document.createElement('div');d.className='cell '+(v==='1'?'wall':'')+(p.x===x&&p.y===y?' player':'')+(exit.x===x&&exit.y===y?' exit':'');m.appendChild(d)}))}function move(dx,dy){let nx=p.x+dx,ny=p.y+dy;if(map[ny]?.[nx]!=='1'){p={x:nx,y:ny};draw();if(p.x===exit.x&&p.y===exit.y)win(150)}}document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{let d=b.dataset.d;move(d==='left'?-1:d==='right'?1:0,d==='up'?-1:d==='down'?1:0)});window.onkeydown=e=>{if(e.key.startsWith('Arrow'))move(e.key==='ArrowLeft'?-1:e.key==='ArrowRight'?1:0,e.key==='ArrowUp'?-1:e.key==='ArrowDown'?1:0)};draw();startTimer(45,()=>fail())}
function reaction(a){a.innerHTML='<button class="reaction">WAIT...</button>';let b=$('.reaction'),done=false,delay=1500+Math.random()*3000;let t=setTimeout(()=>{b.textContent='TAP!';b.style.background='var(--good)';b.style.color='#06100a';let at=performance.now();b.onclick=()=>{if(done)return;done=true;let ms=Math.round(performance.now()-at);win(Math.max(80,220-ms/5))}},delay);b.onclick=()=>{if(!done){clearTimeout(t);fail('TOO EARLY')}};startTimer(8,()=>{clearTimeout(t);fail()})}
function memory(a){let seq=[...Array(16)].map((_,i)=>i).sort(()=>Math.random()-.5).slice(0,6);a.innerHTML='<div class="memory-grid">'+[...Array(16)].map((_,i)=>`<button class="mem" data-i="${i}"></button>`).join('')+'</div>';let cells=[...document.querySelectorAll('.mem')],shown=true;seq.forEach(i=>cells[i].classList.add('on'));setTimeout(()=>{cells.forEach(x=>x.classList.remove('on'));shown=false},1800);let picked=[];cells.forEach(c=>c.onclick=()=>{if(shown||picked.includes(+c.dataset.i))return;c.classList.add('on');picked.push(+c.dataset.i);if(!seq.every(x=>picked.includes(x))&&picked.length>=seq.length){fail('MEMORY FAILED')}else if(picked.length===seq.length){if(seq.every(x=>picked.includes(x)))win(160)}});startTimer(20,()=>fail())}
function target(a){a.innerHTML='<div class="target-area"><button class="target"></button></div>';let t=$('.target'),area=$('.target-area'),hits=0;function move(){t.style.left=Math.random()*(area.clientWidth-58)+'px';t.style.top=Math.random()*(area.clientHeight-58)+'px'}t.onclick=()=>{hits++;score+=25;$('#score').textContent=score;if(hits>=5)win(150);else move()};move();startTimer(20,()=>fail())}
function riddle(a){const rs=[['I speak without a mouth and hear without ears. I have no body, but I come alive with wind. What am I?','echo'],['What has keys but can’t open locks?','keyboard'],['The more you take, the more you leave behind. What are they?','footsteps']];let r=rs[Math.floor(Math.random()*rs.length)];a.innerHTML=`<div class="riddle"><div class="question">${r[0]}</div><input class="input" id="answer" placeholder="Type your answer"><button class="primary" id="check" style="margin-top:12px">SOLVE</button></div>`;$('#check').onclick=()=>{if($('#answer').value.trim().toLowerCase().includes(r[1]))win(170);else fail('NOT THE ANSWER')};startTimer(35,()=>fail())}
function finalWar(a){let step=0;function render(){if(step===0){a.innerHTML='<div class="choices"><button class="choice" id="f1">7 × 8 = ?</button><button class="choice" id="f2">54</button><button class="choice" id="f3">56</button><button class="choice" id="f4">64</button></div>';$('#f1').onclick=bad;$('#f2').onclick=bad;$('#f3').onclick=goodStep;$('#f4').onclick=bad}else if(step===1){a.innerHTML='<div style="text-align:center"><div class="eyebrow">FINAL REACTION</div><button class="reaction" id="finalReact">WAIT...</button></div>';let b=$('#finalReact'),t=setTimeout(()=>{b.textContent='TAP!';b.style.background='var(--good)';b.onclick=goodStep},1200);b.onclick=()=>{clearTimeout(t);bad()}}else{a.innerHTML='<div class="riddle"><div class="question">What number comes next?<br>1, 1, 2, 3, 5, 8, ?</div><input class="input" id="fib"><button class="primary" id="fb" style="margin-top:12px">FINAL ANSWER</button></div>';$('#fb').onclick=()=>$('#fib').value.trim()==='13'?win(300):bad()} }function bad(){fail('FINAL WAR FAILED')}function goodStep(){step++;if(step>=3)win(300);else render()}render();startTimer(35,()=>fail())}
function endGame(success){stopTimer();$('#game').classList.add('hidden');$('#start').classList.add('hidden');$('#final').classList.remove('hidden');$('#finalScore').textContent=score}
$('#startBtn').onclick=()=>{$('#start').classList.add('hidden');$('#game').classList.remove('hidden');level=0;lives=3;score=0;$('#lives').textContent=lives;$('#score').textContent=score;loadLevel(0)};
$('#nextBtn').onclick=()=>{if(level===9)endGame(true);else loadLevel(level+1)};$('#againBtn').onclick=()=>{location.reload()};
</script></body></html>
